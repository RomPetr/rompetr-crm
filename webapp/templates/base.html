<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Разум DEX — CRM публикаций{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Разум DEX <span>CRM</span></a>
    <nav class="nav">
      {% if user is defined and user %}
        <a href="/dashboard">Кабинет</a>
        <a href="/drafts">Черновики</a>
        <a href="/tickets">Тикеты</a>
        {% if user.role == 'admin' %}<a href="/admin">Админка</a>{% endif %}
        <form method="post" action="/logout" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token | default('') }}">
          <button class="link-button" type="submit">Выйти</button>
        </form>
      {% else %}
        <a href="/login">Вход</a>
        <a class="button small" href="/register">Регистрация</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>rompetr.ru · CRM публикации новостей</span>
    <span>Данные и изображения хранятся вне репозитория</span>
  </footer>
</body>
</html>
