{% extends "base.html" %}
{% block title %}Новый пароль{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>Новый пароль</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/reset-password" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="token" value="{{ token }}">
    <label>Пароль (минимум 12 символов)
      <input name="password" type="password" minlength="12" autocomplete="new-password" required>
    </label>
    <label>Повторите пароль
      <input name="password_confirm" type="password" minlength="12" autocomplete="new-password" required>
    </label>
    <button class="button" type="submit">Сохранить пароль</button>
  </form>
  {% include "partials/auth_trust.html" %}
</section>
{% endblock %}
